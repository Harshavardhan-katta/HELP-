<!DOCTYPE html>
<html>
<head>
    <title>Agent login page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ecf2f3;
            margin: 0;
            padding: 20px;
        }
        header {
            color: rgb(6, 6, 6);
            padding: 10px 0;
            text-align: center;
        }
        form {
            background-color: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        label {
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
                 border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to HELP!</h1>
        <h2>Please login to continue</h2>
    </header>
    <form id="agentLoginForm" autocomplete="off">
        <div id="errorMsg" class="error"></div>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>
        <input type="submit" value="Login">

    </form>

<script>
    // List of valid agent credentials
    const AGENTS = [
        { username: "agent1", password: "pass1" },
        { username: "agent2", password: "pass2" },
        { username: "99240040997", password: "Kharsha@9194" },
        { username: "99240040998", password: "Manoj@1712"}
        // Add more agents as needed
    ];

    document.getElementById('agentLoginForm').onsubmit = function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        // Check if any agent matches the entered credentials
        const found = AGENTS.some(agent =>
            agent.username === username && agent.password === password
        );

        if (found) {
            window.location.href = "Helpdesk.html";
        } else {
            document.getElementById('errorMsg').textContent = "Invalid username or password!";
        }
    };
</script>
</body>
</html>
