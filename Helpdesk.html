<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HELPDESK</title>
  <style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #aeb7b76a 0%, #c9e4f6 100%);
  min-height: 100vh;
  margin: 0;
  padding: 30px;
  color: #2a4d7a;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.container {
  background: #f9f9ff;
  border-radius: 14px;
  box-shadow: 0 4px 24px rgba(80, 120, 200, 0.08);
  padding: 32px 20px;
  margin: 40px auto;
  max-width: 1000px;
  width: 100%;
}

h1 {
  color: #1a7fd1;
  text-align: center;
  margin-bottom: 32px;
  letter-spacing: 1px;
}

h2 {
  color: #3bb273;
  margin-top: 32px;
  margin-bottom: 16px;
  letter-spacing: 0.5px;
}

.button-row {
  display: flex;
  gap: 16px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.download-btn, .logout-button {
  background: linear-gradient(90deg, #43ea7c 0%, #3bb273 100%);
  color: #fff;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding: 10px 22px;
  font-size: 1rem;
  transition: background 0.2s, transform 0.2s;
  margin-bottom: 8px;
}
.download-btn:hover, .logout-button:hover {
  background: linear-gradient(90deg, #3bb273 0%, #43ea7c 100%);
  transform: scale(1.05);
}

.logout {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 100;
}

.item-list {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  justify-content: flex-start;
}

.card {
  background: linear-gradient(90deg, #e3f0ff 0%, #f9f9ff 100%);
  border: 1.5px solid #b3d1f7;
  border-radius: 10px;
  margin: 18px 0;
  padding: 18px 16px;
  box-shadow: 0 2px 8px rgba(80, 120, 200, 0.07);
  transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
  min-width: 260px;
  flex: 1 1 260px;
  max-width: 320px;
  position: relative;
  color: #2a4d7a;
}

.card:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 6px 24px rgba(80, 120, 200, 0.13);
  background: linear-gradient(90deg, #d0eaff 0%, #f9f9ff 100%);
}

.card strong {
  color: #3bb273;
}

.card button, .card a.contact-btn {
  margin-top: 12px;
  padding: 8px 18px;
  border-radius: 6px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(90deg, #43ea7c 0%, #3bb273 100%);
  color: #fff;
  transition: background 0.2s, transform 0.2s;
  text-decoration: none;
  display: inline-block;
}

.card button[disabled] {
  background: #bdbdbd;
  color: #fff;
  cursor: not-allowed;
}

.card button:hover:not([disabled]), .card a.contact-btn:hover {
  background: linear-gradient(90deg, #3bb273 0%, #43ea7c 100%);
  transform: scale(1.05);
}

.modal {
  display: none;
  position: fixed;
  z-index: 10;
  left: 0; top: 0; width: 100vw; height: 100vh;
  background: rgba(44,62,80,0.15);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #f9f9ff;
  border-radius: 14px;
  padding: 32px 24px;
  box-shadow: 0 4px 24px #3bb27333;
  min-width: 320px;
  max-width: 90vw;
  position: relative;
  border: 1.5px solid #b3d1f7;
}

.modal-content h3 {
  color: #1a7fd1;
  margin-top: 0;
}

.close-modal {
  position: absolute;
  top: 12px; right: 18px;
  background: none;
  border: none;
  font-size: 1.5rem;
  color: #888;
  cursor: pointer;
}

.modal-content input, .modal-content textarea {
  width: 96%;
  margin: 10px 0;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #b3d1f7;
  font-size: 1rem;
  background: #fff;
  color: #2a4d7a;
}

.modal-content button[type="submit"] {
  background: linear-gradient(90deg, #ff7e5f 0%, #feb47b 100%);
  color: #fff;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding: 10px 22px;
  margin-top: 10px;
  transition: background 0.2s, transform 0.2s;
}

.modal-content button[type="submit"]:hover {
  background: linear-gradient(90deg, #feb47b 0%, #ff7e5f 100%);
  transform: scale(1.05);
}

@media (max-width: 700px) {
  .container { padding: 12px 2vw; }
  .item-list { flex-direction: column; }
  .card { min-width: 90vw; }
}
  </style>
</head>
<body>
  <div class="container">
    <h1>HELPDESK MANAGEMENT</h1>

    <div class="button-row">
      <button class="download-btn" onclick="downloadCSV('lost')">Download Lost Items CSV</button>
      <button class="download-btn" onclick="downloadCSV('found')">Download Found Items CSV</button>
      <button class="download-btn" onclick="downloadCSV('claimed')">Download Claimed Lost Items CSV</button>
    </div>

    <h2>Lost Items</h2>
    <div class="item-list" id="lostItemsList"></div>

    <h2>Found Items</h2>
    <div class="item-list" id="foundItemsList"></div>

    <h2>Claimed Lost Items</h2>
    <div class="item-list" id="claimedItemsList"></div>
  </div>
  <div class="logout">
    <button class="logout-button" onclick="window.location.href='index.html'">Logout</button>
  </div>

  <!-- Modal for Return Form -->
  <div class="modal" id="returnModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeReturnModal()">&times;</button>
      <h3>Return Item</h3>
      <form id="returnForm">
        <input name="receiver" placeholder="Receiver Name" required>
        <input name="date" type="date" required>
        <textarea name="remarks" placeholder="Remarks"></textarea>
        <input type="hidden" name="itemId" id="returnItemId">
        <button type="submit">Submit Return</button>
      </form>
    </div>
  </div>

  <script>
    // Dummy data for demonstration (remove if using real localStorage data)
    if (!localStorage.getItem('lostItems')) {
      localStorage.setItem('lostItems', JSON.stringify([
        {id: 1, name: "Wallet", description: "Black leather", location: "Cafeteria", email: "user1@example.com"},
        {id: 2, name: "Phone", description: "Redmi Note 10", location: "Library", email: "user2@example.com"}
      ]));
    }
    if (!localStorage.getItem('foundItems')) {
      localStorage.setItem('foundItems', JSON.stringify([
        {id: 101, name: "Bag", description: "Blue backpack", location: "Main Gate", email: "finder1@example.com"},
        {id: 102, name: "Keys", description: "Car keys", location: "Parking Lot", email: "finder2@example.com"}
      ]));
    }
    if (!localStorage.getItem('claimedItems')) {
      localStorage.setItem('claimedItems', JSON.stringify([]));
    }

    // Render Lost Items
    function renderLostItems() {
      const lostItems = JSON.parse(localStorage.getItem('lostItems') || '[]');
      const lostList = document.getElementById('lostItemsList');
      lostList.innerHTML = lostItems.map(item => `
        <div class="card">
          <strong>Item:</strong> ${item.name}<br>
          <strong>Description:</strong> ${item.description}<br>
          <strong>Location:</strong> ${item.location}<br>
          <strong>Owner Email:</strong> <a href="mailto:${item.email}">${item.email}</a><br>
          <button onclick="openReturnModal(${item.id})">Return</button>
        </div>
      `).join('');
    }

    // Render Found Items
    function renderFoundItems() {
      const foundItems = JSON.parse(localStorage.getItem('foundItems') || '[]');
      const foundList = document.getElementById('foundItemsList');
      foundList.innerHTML = foundItems.map(item => `
        <div class="card">
          <strong>Item:</strong> ${item.name}<br>
          <strong>Description:</strong> ${item.description}<br>
          <strong>Location:</strong> ${item.location}<br>
          <strong>Contact Email:</strong> <a href="mailto:${item.email}" class="contact-btn">Contact</a>
        </div>
      `).join('');
    }

    // Render Claimed Lost Items
    function renderClaimedItems() {
      const claimedItems = JSON.parse(localStorage.getItem('claimedItems') || '[]');
      const claimedList = document.getElementById('claimedItemsList');
      if (claimedItems.length === 0) {
        claimedList.innerHTML = "<p>No claimed lost items yet.</p>";
        return;
      }
      claimedList.innerHTML = claimedItems.map(item => `
        <div class="card">
          <strong>Item:</strong> ${item.name}<br>
          <strong>Description:</strong> ${item.description}<br>
          <strong>Location:</strong> ${item.location}<br>
          <strong>Owner Email:</strong> <a href="mailto:${item.email}">${item.email}</a><br>
          <strong>Returned To:</strong> ${item.receiver}<br>
          <strong>Return Date:</strong> ${item.date}<br>
          <strong>Remarks:</strong> ${item.remarks || "None"}
        </div>
      `).join('');
    }

    // Modal logic
    function openReturnModal(itemId) {
      document.getElementById('returnModal').style.display = 'flex';
      document.getElementById('returnItemId').value = itemId;
    }
    function closeReturnModal() {
      document.getElementById('returnModal').style.display = 'none';
      document.getElementById('returnForm').reset();
    }

    // Handle Return Form submission
    document.getElementById('returnForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const lostItems = JSON.parse(localStorage.getItem('lostItems') || '[]');
      const claimedItems = JSON.parse(localStorage.getItem('claimedItems') || '[]');
      const itemId = parseInt(this.itemId.value, 10);
      const idx = lostItems.findIndex(item => item.id === itemId);
      if (idx !== -1) {
        // Add return info to item and move to claimed
        const item = lostItems.splice(idx, 1)[0];
        item.receiver = this.receiver.value;
        item.date = this.date.value;
        item.remarks = this.remarks.value;
        claimedItems.push(item);
        localStorage.setItem('lostItems', JSON.stringify(lostItems));
        localStorage.setItem('claimedItems', JSON.stringify(claimedItems));
      }
      closeReturnModal();
      renderLostItems();
      renderClaimedItems();
    });

    // CSV Download
    function downloadCSV(type) {
      let items = [];
      let filename = '';
      if (type === 'lost') {
        items = JSON.parse(localStorage.getItem('lostItems') || '[]');
        filename = 'lost_items.csv';
      } else if (type === 'found') {
        items = JSON.parse(localStorage.getItem('foundItems') || '[]');
        filename = 'found_items.csv';
      } else if (type === 'claimed') {
        items = JSON.parse(localStorage.getItem('claimedItems') || '[]');
        filename = 'claimed_lost_items.csv';
      }
      if (items.length === 0) {
        alert('No data to export!');
        return;
      }
      // Get all unique keys
      const keys = Array.from(items.reduce((set, item) => {
        Object.keys(item).forEach(k => set.add(k));
        return set;
      }, new Set()));
      const csvRows = [
        keys.join(','),
        ...items.map(item => keys.map(k => `"${(item[k]||'').toString().replace(/"/g, '""')}"`).join(','))
      ];
      const csvContent = csvRows.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Initial render
    renderLostItems();
    renderFoundItems();
    renderClaimedItems();
  </script>
</body>
</html>
